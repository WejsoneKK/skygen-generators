[versions]
kotlin = "2.5.0-Beta1"

paper-api = "1.21.8-R0.1-SNAPSHOT"
minecraft = "1.21.8"

paperweight-userdev = "2.0.0-beta.21"
shadow = "9.6.1"
run-task = "3.1.0"
eldoria-paper = "0.9.0"
okaeri-configs = "6.1.0-beta.4"
okaeri-placeholders = "6.0.0-beta.8"
eternalcommons = "1.4.1"
multification = "1.2.4"
litecommands = "3.11.0"
triumph-gui = "3.1.13"
orm-lite = "6.1"
h2database = "2.1.214"
hikaricp = "7.1.0"
mariadb = "3.5.1"
postgresql = "42.7.5"
caffeine = "3.1.8"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
ormlite-core = { module = "com.j256.ormlite:ormlite-core", version.ref = "orm-lite"}
ormlite-jdbc = { module = "com.j256.ormlite:ormlite-jdbc", version.ref = "orm-lite"}
h2database = { module = "com.h2database:h2", version.ref = "h2database"}
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb"}
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql"}
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp"}
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine"}
okaeri-configs-yaml = { module = "eu.okaeri:okaeri-configs-yaml-snakeyaml", version.ref = "okaeri-configs"}
okaeri-configs-json-simple = { module = "eu.okaeri:okaeri-configs-json-simple", version.ref = "okaeri-configs"}
okaeri-configs-yam-bukkit = { module = "eu.okaeri:okaeri-configs-yaml-bukkit", version.ref = "okaeri-configs"}
okaeri-configs-serdes-adventure = { module = "eu.okaeri:okaeri-configs-serdes-adventure", version.ref = "okaeri-configs"}
okaeri-placeholders-adventure = { module = "eu.okaeri:okaeri-placeholders-adventure", version.ref = "okaeri-placeholders"}
okaeri-placeholders-bukkit = { module = "eu.okaeri:okaeri-placeholders-bukkit", version.ref = "okaeri-placeholders"}
triumph-gui = { module = "dev.triumphteam:triumph-gui", version.ref = "triumph-gui"}
litecommands = { module = "dev.rollczi:litecommands-bukkit", version.ref = "litecommands"}
eternalcommons-loom = { module = "com.eternalcode:eternalcode-commons-bukkit-loom", version.ref = "eternalcommons"}
eternalcommons-adventure = { module = "com.eternalcode:eternalcode-commons-adventure", version.ref = "eternalcommons"}
multification-okaeri = { module = "com.eternalcode:multification-okaeri", version.ref = "multification"}
multification-paper = { module = "com.eternalcode:multification-paper", version.ref = "multification"}
[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight-userdev" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
eldoria-paper = { id = "de.eldoria.plugin-yml.paper", version.ref = "eldoria-paper"}
